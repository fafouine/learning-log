name: Generate Tag Index

# Regenerate the tag index whenever learning logs or concept notes change on main.
on:
  push:
    branches:
      - main
    paths:
      - 'LOGS/**'
      - 'concepts/**'
  workflow_dispatch: {}

# Allow the job to commit the regenerated index back to the repository.
permissions:
  contents: write

# Avoid overlapping runs racing to push to the same branch.
concurrency:
  group: generate-tag-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-tag-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tag index
        run: python scripts/generate_tag_index.py

      - name: Commit and push updated tag index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain tags/)" ]; then
            git add tags/
            git commit -m "chore: regenerate tag index [skip ci]"
            git push
          else
            echo "No changes to the tag index; nothing to commit."
          fi
